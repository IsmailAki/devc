name: python
description: Install Python and pip
version: "1.0.0"
depends: []
params:
  version:
    description: Python version to install
    default: "3"
install:
  - name: Install Python
    run: |
      set -e
      VERSION={{.Version}}
      if [ "$VERSION" = "3" ] || [ "$VERSION" = "3.10" ]; then
        apt-get update && apt-get install -y python3 python3-pip python3-venv && rm -rf /var/lib/apt/lists/*
      else
        apt-get update && apt-get install -y software-properties-common && add-apt-repository -y ppa:deadsnakes/ppa && apt-get update && apt-get install -y python${VERSION} python${VERSION}-venv python${VERSION}-dev && rm -rf /var/lib/apt/lists/* && curl -sS https://bootstrap.pypa.io/get-pip.py | python${VERSION}
      fi