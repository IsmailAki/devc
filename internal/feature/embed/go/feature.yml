name: go
description: Install Go toolchain
version: "1.0.0"
depends: []
params:
  version:
    description: Go version to install
    default: "latest"
install:
  - name: Download and install Go
    run: |
      set -e
      if [ "{{.Version}}" = "latest" ]; then
        VERSION=$(wget -qO- https://go.dev/dl/ | grep -o 'go[0-9.]*\.linux' | head -1 | sed 's/go//' | sed 's/\.linux//')
      else
        VERSION={{.Version}}
      fi
      ARCH=$(uname -m | sed 's/aarch64/arm64/' | sed 's/x86_64/amd64/')
      wget -q https://go.dev/dl/go${VERSION}.linux-${ARCH}.tar.gz -O /tmp/go.tar.gz
      rm -rf /usr/local/go
      tar -C /usr/local -xzf /tmp/go.tar.gz
      rm /tmp/go.tar.gz
      ln -sf /usr/local/go/bin/* /usr/local/bin/
      echo 'export PATH=$PATH:/usr/local/go/bin' >> /home/dev/.bashrc
