name: docker
description: Install Docker CLI for Docker-in-Docker
version: "1.0.0"
depends: []
params: {}
install:
  - name: Install Docker
    run: |
      set -e
      curl -fsSL https://get.docker.com -o get-docker.sh
      sh get-docker.sh
      rm get-docker.sh
      apt-get update
      apt-get install -y uidmap
      rm -rf /var/lib/apt/lists/*
      usermod -aG docker dev
